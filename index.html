<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Hacker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- مؤثرات الخلفية والأورب المضيء -->
  <div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- الشريط التنقلي الجانبي مع إرجاع أيقونة اللوجو -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <span id="site-name">Pro Hacker</span>
      </div>
    </div>
    <nav class="section-nav" id="section-nav"></nav>
  </aside>

  <!-- جسم محتوى الصفحة الرئيسي -->
  <main class="main-content">
    <header class="hero">
      <div class="hero-badge" id="hero-badge">Loading Platforms...</div>
      <h1 class="hero-title"><span id="site-name-hero">Pro Hacker</span></h1>
      <p class="hero-tagline" id="hero-tagline"></p>

      <div class="hero-stats">
        <div class="stat">
          <span class="stat-number" id="sections-count" data-target="1">0</span>
          <span class="stat-label">Available Hacks</span>
        </div>
      </div>

      <a href="#" class="hero-btn" id="hero-btn">Explore Directory</a>
    </header>

    <!-- الأقسام البرمجية المحقونة تلقائياً عبر السكريبت -->
    <div id="sections-container"></div>

    <footer class="footer">
      <p>Pro Hacker © 2026 — Premium Roblox Hacks</p>
    </footer>
  </main>

  <script src="js/hacks.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
