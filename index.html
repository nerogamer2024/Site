<style>

.social-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  padding: 18px 22px;
  background: rgba(4, 9, 20, 0.7);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}

.social-top .logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  text-decoration: none;
  color: #fff;
  position: relative;
}

.social-top .logo .avatar {
  width: 65px;
  height: 65px;
  min-width: 65px;
  min-height: 65px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-sizing: border-box;
  border: 2px solid rgba(25, 135, 255, 0.4);
  background: #0a1a2e;
  box-shadow: 0 0 30px rgba(25, 135, 255, 0.3);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  padding: 0;
  animation: logoFloat 5s ease-in-out infinite;
}

.social-top .logo .avatar img {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  object-fit: contain;
  object-position: center center;
  transform: translateY(2px) scale(1.2);
  transform-origin: center center;
  background: transparent;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.social-top .logo .avatar:hover {
  transform: scale(1.15);
  border-color: #2a8fff;
  box-shadow: 0 0 60px rgba(25, 135, 255, 0.6);
}

.social-top .logo .avatar:hover img {
  transform: translateY(2px) scale(1.35);
}

.social-top .logo span {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(90deg, #fff, #6acbff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
  position: relative;
}

.social-top .logo span::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0%;
  height: 2px;
  background: linear-gradient(90deg, #1987ff, #43d9ff);
  transition: width 0.4s ease;
}

.social-top .logo:hover span::after {
  width: 100%;
}

.social-top .social-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.social-top .social-links a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border-radius: 40px;
  background: rgba(21, 114, 255, 0.06);
  border: 1px solid rgba(35, 141, 255, 0.15);
  color: #c8dfff;
  text-decoration: none;
  font-size: 15px;
  font-weight: 700;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(4px);
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.social-top .social-links a::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transition: left 0.6s ease;
}

.social-top .social-links a:hover::before {
  left: 100%;
}

.social-top .social-links a .icon {
  font-size: 18px;
}

.social-top .social-links a:hover {
  background: rgba(21, 114, 255, 0.15);
  border-color: #2a8fff;
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 10px 35px rgba(22, 140, 255, 0.25);
  color: #fff;
}

.social-top .social-links a.youtube:hover {
  border-color: #ff3b4a;
  background: rgba(255, 59, 74, 0.15);
  box-shadow: 0 10px 35px rgba(255, 59, 74, 0.2);
}

.social-top .social-links a.discord:hover {
  border-color: #5865f2;
  background: rgba(88, 101, 242, 0.15);
  box-shadow: 0 10px 35px rgba(88, 101, 242, 0.2);
}

.social-top .social-links a.roblox:hover {
  border-color: #00b2ff;
  background: rgba(0, 178, 255, 0.15);
  box-shadow: 0 10px 35px rgba(0, 178, 255, 0.2);
}

.social-top .social-links a.site:hover {
  border-color: #7c3aed;
  background: rgba(124, 58, 237, 0.15);
  box-shadow: 0 10px 35px rgba(124, 58, 237, 0.2);
}

.social-top .social-links a.site .icon {
  color: #a78bfa;
}

.social-top .social-links a.site:hover .icon {
  color: #c4b5fd;
}

.social-top .lang-btn {
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 40px;
  background: rgba(9, 23, 41, 0.8);
  color: #7ed0ff;
  font: 700 14px Cairo;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}

.social-top .lang-btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(42, 143, 255, 0.2);
  transform: translate(-50%, -50%);
  transition: width 0.6s ease, height 0.6s ease;
}

.social-top .lang-btn:hover::before {
  width: 300px;
  height: 300px;
}

.social-top .lang-btn:hover {
  border-color: #2b9cff;
  transform: translateY(-2px);
  box-shadow: 0 8px 25px #168cff1d;
}

.hero {
  padding-top: 50px !important;
  position: relative;
}

.hero .eyebrow {
  display: inline-block;
  padding: 8px 20px;
  border: 1px solid rgba(67, 217, 255, 0.2);
  border-radius: 30px;
  background: rgba(67, 217, 255, 0.05);
  font-size: 10px;
  letter-spacing: 2px;
  color: #4bc5ff;
  font-weight: 800;
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}

.hero .eyebrow:hover {
  background: rgba(67, 217, 255, 0.1);
  border-color: rgba(67, 217, 255, 0.4);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(67, 217, 255, 0.1);
}

.stats-bar {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 25px 30px;
  margin: 20px auto 0;
  max-width: 900px;
  background: rgba(4, 9, 20, 0.5);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(67, 217, 255, 0.15);
  border-radius: 20px;
  flex-wrap: wrap;
  box-shadow: 0 15px 50px rgba(0,0,0,0.3);
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 20px;
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.04);
  transition: all 0.4s ease;
  min-width: 100px;
}

.stat-item:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(67, 217, 255, 0.1);
  transform: translateY(-3px);
}

.stat-item .stat-number {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, #1987ff, #43d9ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.2;
}

.stat-item .stat-label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.filter-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 18px 24px;
  margin: 15px auto 0;
  max-width: 900px;
  background: rgba(4, 9, 20, 0.35);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(67, 217, 255, 0.08);
  border-radius: 18px;
  flex-wrap: wrap;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.filter-bar .filter-label {
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
}

.filter-bar .filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(4, 9, 20, 0.4);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid rgba(67, 217, 255, 0.06);
}

.filter-bar .filter-group .filter-btn {
  padding: 8px 18px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: #8faac4;
  font: 700 13px Cairo;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

.filter-bar .filter-group .filter-btn:hover {
  color: #dff4ff;
}

.filter-bar .filter-group .filter-btn.active {
  background: linear-gradient(135deg, rgba(25, 135, 255, 0.25), rgba(67, 217, 255, 0.1));
  color: #fff;
  box-shadow: 0 4px 20px rgba(25, 135, 255, 0.15);
}

.filter-bar .filter-group .filter-btn .badge-filter {
  display: inline-block;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 0 8px;
  font-size: 10px;
  margin-right: 4px;
  color: #8eb8d9;
}

.filter-bar .filter-group .filter-btn.active .badge-filter {
  background: rgba(25, 135, 255, 0.2);
  color: #9edfff;
}

.filter-bar .sort-wrapper {
  position: relative;
  display: inline-block;
}

.filter-bar .sort-wrapper .sort-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #8faac4;
  font-size: 14px;
  pointer-events: none;
  z-index: 1;
}

.filter-bar .sort-select {
  padding: 8px 35px 8px 16px;
  border: 1px solid rgba(67, 217, 255, 0.1);
  border-radius: 12px;
  background: rgba(4, 9, 20, 0.6);
  color: #c8dfff;
  font: 600 13px Cairo;
  cursor: pointer;
  transition: all 0.3s ease;
  appearance: none;
  min-width: 160px;
  position: relative;
}

.filter-bar .sort-select:hover {
  border-color: rgba(67, 217, 255, 0.3);
  background: rgba(4, 9, 20, 0.8);
}

.filter-bar .sort-select:focus {
  outline: none;
  border-color: #43d9ff;
  box-shadow: 0 0 25px rgba(67, 217, 255, 0.08);
}

.filter-bar .sort-select option {
  background: #0a1a2e;
  color: #c8dfff;
  padding: 8px;
}

.filter-bar .sort-select option:hover {
  background: #1a3a5e;
}

.bookmark-section {
  max-width: 1050px;
  margin: 20px auto 0;
  padding: 0 22px;
}

.bookmark-section .bookmark-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 22px;
  background: rgba(4, 9, 20, 0.4);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(67, 217, 255, 0.1);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.bookmark-section .bookmark-header:hover {
  border-color: rgba(67, 217, 255, 0.25);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.bookmark-section .bookmark-header h3 {
  margin: 0;
  font-size: 18px;
  color: #8fcbff;
  display: flex;
  align-items: center;
  gap: 10px;
}

.bookmark-section .bookmark-header .badge-count {
  background: rgba(251, 191, 36, 0.15);
  padding: 2px 14px;
  border-radius: 20px;
  font-size: 13px;
  color: #fbbf24;
  font-weight: 700;
}

.bookmark-section .bookmark-header .arrow {
  font-size: 20px;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  color: var(--muted);
}

.bookmark-section .bookmark-header .arrow.open {
  transform: rotate(180deg);
}

.bookmark-section .bookmark-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
  opacity: 0;
}

.bookmark-section .bookmark-content.open {
  max-height: 5000px;
  opacity: 1;
}

.bookmark-section .bookmark-content .empty-bookmarks {
  text-align: center;
  padding: 50px;
  color: var(--muted);
  border: 2px dashed rgba(67, 217, 255, 0.08);
  border-radius: 16px;
  margin-top: 12px;
  font-size: 16px;
}

.game-tabs {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(4, 9, 20, 0.3);
}

.game-tabs .tab-btn {
  position: relative;
  min-width: 155px;
  padding: 11px 24px;
  border: 1px solid rgba(75, 160, 255, 0.18);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(14, 32, 55, 0.9), rgba(5, 15, 28, 0.95));
  color: #8faac4;
  font: 700 14px Cairo, sans-serif;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 5px 18px rgba(0,0,0,.18);
  overflow: hidden;
}

.game-tabs .tab-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
  transform: skewX(-20deg);
  transition: left .5s ease;
}

.game-tabs .tab-btn:hover::before {
  left: 140%;
}

.game-tabs .tab-btn:hover {
  color: #dff4ff;
  border-color: rgba(42, 143, 255, .55);
  background: linear-gradient(135deg, rgba(20, 55, 90, .95), rgba(7, 22, 40, .98));
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(20, 140, 255, .12);
}

.game-tabs .tab-btn.active {
  color: #fff;
  border-color: #2a8fff;
  background: linear-gradient(135deg, rgba(20, 115, 235, .30), rgba(20, 190, 255, .10));
  box-shadow: 0 0 20px rgba(25, 135, 255, .16), inset 0 0 20px rgba(25, 135, 255, .06);
  transform: translateY(-1px);
}

.game-tabs .tab-btn.active::after {
  content: "";
  position: absolute;
  left: 25%;
  right: 25%;
  bottom: 0;
  height: 2px;
  border-radius: 10px;
  background: linear-gradient(90deg, transparent, #43d9ff, transparent);
  box-shadow: 0 0 10px #43d9ff;
}

.game-tabs .tab-btn .badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 22px;
  margin-right: 7px;
  padding: 0 7px;
  border-radius: 8px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.06);
  color: #8eb8d9;
  font-size: 11px;
  font-weight: 800;
  transition: .25s ease;
}

.game-tabs .tab-btn.active .badge {
  background: rgba(42, 143, 255, .20);
  border-color: rgba(42, 143, 255, .35);
  color: #9edfff;
  box-shadow: 0 0 12px rgba(42, 143, 255, .15);
}

.game-tabs .tab-btn:active {
  transform: translateY(0) scale(.97);
}

.script-section {
  padding: 5px 0;
}

.script-item {
  position: relative;
  margin-bottom: 12px;
  padding: 16px 20px;
  background: rgba(4, 9, 20, 0.4);
  border: 1px solid var(--line);
  border-radius: 14px;
  transition: all 0.3s ease;
}

.script-item:hover {
  border-color: #2a8fff55;
  box-shadow: 0 0 30px rgba(25, 135, 255, 0.05);
  transform: translateY(-2px);
}

.script-item .code {
  min-height: 80px;
  border-radius: 12px;
  padding: 18px 80px 18px 18px;
  background: #020811;
  border: 1px solid #1c3b5c;
  position: relative;
  transition: all 0.3s ease;
}

.script-item .code code {
  font: 13px Consolas, monospace;
  line-height: 1.8;
  color: #b6e3ff;
  white-space: pre-wrap;
  word-break: break-all;
}

.script-item .code .copy {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  height: 44px;
  padding: 0 18px;
  border: 1px solid #2a8fff;
  background: linear-gradient(135deg, #0e65dc, #14a6ff);
  border-radius: 10px;
  color: #fff;
  font: 700 12px Cairo;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(22, 140, 255, 0.2);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.script-item .code .copy:hover {
  transform: translateY(-50%) scale(1.05);
  box-shadow: 0 12px 40px rgba(22, 140, 255, 0.35);
}

.script-item .code .copy:active {
  transform: translateY(-50%) scale(0.95);
}

.script-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 10px;
}

.script-header .script-name {
  font-size: 16px;
  font-weight: 700;
  color: #8fcbff;
}

.script-rating {
  display: flex;
  align-items: center;
  gap: 8px;
}

.script-rating .stars {
  display: flex;
  gap: 3px;
  direction: ltr;
}

.script-rating .stars .star {
  font-size: 18px;
  cursor: pointer;
  color: #4a5568;
  transition: all 0.3s ease;
  user-select: none;
}

.script-rating .stars .star.active {
  color: #fbbf24;
}

.script-rating .stars .star:hover {
  transform: scale(1.2);
}

.script-rating .rating-text {
  font-size: 12px;
  color: var(--muted);
}

.bookmark-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: #4a5568;
  transition: all 0.3s ease;
  padding: 4px 8px;
  border-radius: 8px;
}

.bookmark-btn:hover {
  transform: scale(1.2);
}

.bookmark-btn.bookmarked {
  color: #fbbf24;
}

.bookmark-btn.bookmarked:hover {
  color: #f59e0b;
}

.script-info {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.script-info .info-tag {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
  padding: 3px 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.05);
}

.script-info .copy-count {
  display: flex;
  align-items: center;
  gap: 4px;
}

.script-info .copy-count span {
  color: #8fcbff;
  font-weight: 700;
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px) scale(0.9);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 30px 16px 26px;
  background: rgba(6, 18, 40, 0.92);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(67, 217, 255, 0.30);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.50), 0 0 45px rgba(25, 135, 255, 0.10);
  opacity: 0;
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 999;
  pointer-events: none;
  white-space: nowrap;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0) scale(1);
}

#toast .toast-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, rgba(25, 135, 255, 0.25), rgba(67, 217, 255, 0.15));
  border-radius: 50%;
  font-size: 20px;
  flex-shrink: 0;
  border: 1px solid rgba(67, 217, 255, 0.25);
  color: #43d9ff;
  animation: toastIconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

#toast .toast-text {
  font-size: 16px;
  font-weight: 600;
  color: #e4f2ff;
  letter-spacing: 0.3px;
}

#toast .toast-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, #1987ff, #43d9ff);
  border-radius: 0 0 18px 18px;
  width: 100%;
  opacity: 0.6;
  transition: width 1.5s linear;
}

#toast.show .toast-progress {
  width: 0%;
}

@keyframes toastIconPop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

#backToTop {
  position: fixed;
  bottom: 100px;
  right: 30px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(67, 217, 255, 0.3);
  background: rgba(4, 9, 20, 0.8);

            {
              name: '🏷️ النوع',
              value: typeText,
              inline: true
            },
            {
              name: '⭐ التقييم',
              value: `${starsText} (${rating}/5)`,
              inline: false
            }
          ],
          footer: {
            text: 'PRO HACKER • Rating System'
          },
          timestamp: new Date().toISOString()
        }
      ]
    };

    fetch(DISCORD_WEBHOOK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    }).catch(err => console.error('خطأ في إرسال التقييم إلى الديسكورد:', err));
  }

  function setRating(gameIndex, tab, scriptIndex, rating) {
    const games = window.gamesData || [];
    const game = games[gameIndex];
    const script = game?.scripts[tab]?.[scriptIndex];
    if (!script) return;

    script.rating = rating;
    localStorage.setItem('ratings', JSON.stringify(
      games.flatMap((g, gi) =>
        ['key', 'nokey'].flatMap(t =>
          (g.scripts[t] || []).map((s, si) =>
            s.rating ? { game: gi, tab: t, index: si, rating: s.rating } : null
          ).filter(Boolean)
        )
      )
    ));

    sendRatingToDiscord(game.name, script.name, rating, tab);

    render();
    renderBookmarks();
  }

  function loadRatings() {
    try {
      const data = JSON.parse(localStorage.getItem('ratings') || '[]');
      const games = window.gamesData || [];
      data.forEach(({ game, tab, index, rating }) => {
        if (games[game]?.scripts[tab]?.[index]) {
          games[game].scripts[tab][index].rating = rating;
        }
      });
    } catch (e) {}
  }

  const backToTop = document.getElementById('backToTop');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) {
      backToTop.classList.add('visible');
    } else {
      backToTop.classList.remove('visible');
    }
  });

  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  let bookmarksOpen = false;
  document.getElementById('bookmarkToggle').addEventListener('click', () => {
    bookmarksOpen = !bookmarksOpen;
    document.getElementById('bookmarkContent').classList.toggle('open', bookmarksOpen);
    document.getElementById('bookmarkArrow').classList.toggle('open', bookmarksOpen);
  });

  function renderBookmarks() {
    const games = window.gamesData || [];
    let html = '';
    let hasBookmarks = false;

    games.forEach((game, gi) => {
      ['key', 'nokey'].forEach(tab => {
        if (game.scripts && game.scripts[tab]) {
          game.scripts[tab].forEach((script, si) => {
            if (script.bookmarked) {
              hasBookmarks = true;
              html += `
                <div class="script-item" style="border-color: #fbbf2444;">
                  <div class="script-header">
                    <span class="script-name">⭐ ${script.name}</span>
                    <div style="display:flex;align-items:center;gap:12px;">
                      <div class="script-rating">
                        <div class="stars" dir="ltr">
                          ${[1,2,3,4,5].map(star => `
                            <span class="star ${(script.rating || 0) >= star ? 'active' : ''}" 
                                  onclick="setRating(${gi}, '${tab}', ${si}, ${star})">★</span>
                          `).join('')}
                        </div>
                        <span class="rating-text">${script.rating || 0}/5</span>
                      </div>
                      <button class="bookmark-btn bookmarked" 
                              onclick="toggleBookmark(${gi}, '${tab}', ${si})">⭐</button>
                    </div>
                  </div>
                  <div class="code">
                    <code>${script.code}</code>
                    <button class="copy" onclick="copyScript(${gi}, '${tab}', ${si})">C</button>
                  </div>
                  <div class="script-info">
                    <span class="info-tag copy-count">📋 نسخ : <span>${script.copies || 0}</span></span>
                    <span class="info-tag">${game.name}</span>
                  </div>
                </div>
              `;
            }
          });
        }
      });
    });

    if (!hasBookmarks) {
      html = `<div class="empty-bookmarks" data-ar="لا توجد سكربتات مفضلة بعد" data-en="No bookmarked scripts yet">
                لا توجد سكربتات مفضلة بعد
              </div>`;
    }

    document.getElementById('bookmarkCards').innerHTML = html;
    updateTranslations();
  }

  let currentFilter = 'all';

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      render();
    });
  });

  document.getElementById('sortBy').addEventListener('change', () => render());

  let currentLang = localStorage.getItem('phLang') || 'ar';

  function updateTranslations() {
    document.querySelectorAll('[data-ar][data-en]').forEach(el => {
      el.textContent = currentLang === 'ar' ? el.dataset.ar : el.dataset.en;
    });

    document.querySelectorAll('.filter-btn [data-ar][data-en]').forEach(el => {
      el.textContent = currentLang === 'ar' ? el.dataset.ar : el.dataset.en;
    });

    document.querySelectorAll('.sort-select option[data-ar][data-en]').forEach(opt => {
      opt.textContent = currentLang === 'ar' ? opt.dataset.ar : opt.dataset.en;
    });

    const search = document.getElementById('search');
    if (search) {
      search.placeholder = currentLang === 'ar' ? search.dataset.arPlaceholder : search.dataset.enPlaceholder;
    }

    document.getElementById('lang').textContent = currentLang === 'ar' ? 'EN' : 'AR';
  }

  document.getElementById('lang').addEventListener('click', () => {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('phLang', currentLang);
    updateTranslations();
    render();
    renderBookmarks();
  });

  window.copyScript = async function(gameIndex, tab, scriptIndex) {
    const games = window.gamesData || [];
    const script = games[gameIndex]?.scripts[tab]?.[scriptIndex];
    if (!script) return;

    try {
      await navigator.clipboard.writeText(script.code);
    } catch {
      const textarea = document.createElement('textarea');
      textarea.value = script.code;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    }

    script.copies = (script.copies || 0) + 1;
    localStorage.setItem('copyCounts', JSON.stringify(
      games.flatMap((g, gi) =>
        ['key', 'nokey'].flatMap(t =>
          (g.scripts[t] || []).map((s, si) =>
            s.copies ? { game: gi, tab: t, index: si, copies: s.copies } : null
          ).filter(Boolean)
        )
      )
    ));

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
    updateStats();
    render();
    renderBookmarks();
  };

  function loadCopyCounts() {
    try {
      const data = JSON.parse(localStorage.getItem('copyCounts') || '[]');
      const games = window.gamesData || [];
      data.forEach(({ game, tab, index, copies }) => {
        if (games[game]?.scripts[tab]?.[index]) {
          games[game].scripts[tab][index].copies = copies;
        }
      });
    } catch (e) {}
  }

  window.activeTab = {};

  window.render = function() {
    const games = window.gamesData || [];
    const search = document.getElementById('search')?.value?.trim()?.toLowerCase() || '';
    const sortBy = document.getElementById('sortBy')?.value || 'name';

    let html = '';
    let resultCount = 0;

    let filteredGames = games.filter((game, index) => {
      let searchText = game.name + ' ' + (game.nameAr || '') + ' ' + game.desc + ' ' + (game.descAr || '');
      
      if (currentFilter !== 'all') {
        const hasScripts = game.scripts && game.scripts[currentFilter] && game.scripts[currentFilter].length > 0;
        if (!hasScripts) return false;
      }

      if (search) {
        let found = false;
        ['key', 'nokey'].forEach(type => {
          if (game.scripts && game.scripts[type]) {
            game.scripts[type].forEach(script => {
              const scriptText = script.name + ' ' + (script.nameAr || '') + ' ' + script.code;
              if (scriptText.toLowerCase().includes(search)) found = true;
            });
          }
        });
        if (!found && !searchText.toLowerCase().includes(search)) return false;
      }

      return true;
    });

    filteredGames.sort((a, b) => {
      if (sortBy === 'name') return a.name.localeCompare(b.name);
      if (sortBy === 'rating') {
        let aRating = 0, bRating = 0, aCount = 0, bCount = 0;
        ['key', 'nokey'].forEach(type => {
          if (a.scripts && a.scripts[type]) {
            a.scripts[type].forEach(s => { aRating += s.rating || 0; aCount++; });
          }
          if (b.scripts && b.scripts[type]) {
            b.scripts[type].forEach(s => { bRating += s.rating || 0; bCount++; });
          }
        });
        return (bRating / (bCount || 1)) - (aRating / (aCount || 1));
      }
      if (sortBy === 'copies') {
        let aCopies = 0, bCopies = 0;
        ['key', 'nokey'].forEach(type => {
          if (a.scripts && a.scripts[type]) {
            a.scripts[type].forEach(s => { aCopies += s.copies || 0; });
          }
          if (b.scripts && b.scripts[type]) {
            b.scripts[type].forEach(s => { bCopies += s.copies || 0; });
          }
        });
        return bCopies - aCopies;
      }
      return 0;
    });

    filteredGames.forEach((game, index) => {
      let defaultTab = 'key';
      if (currentFilter === 'nokey') {
        defaultTab = 'nokey';
      } else if (currentFilter === 'key') {
        defaultTab = 'key';
      } else {
        if (game.scripts?.key?.length > 0) defaultTab = 'key';
        else if (game.scripts?.nokey?.length > 0) defaultTab = 'nokey';
      }
      
      if (!window.activeTab[index]) {
        window.activeTab[index] = defaultTab;
      } else {
        if (currentFilter !== 'all') {
          if (window.activeTab[index] !== currentFilter) {
            window.activeTab[index] = currentFilter;
          }
        }
      }
      
      const currentTab = window.activeTab[index];
      
      let scripts = [];
      if (currentFilter === 'all') {
        if (game.scripts && game.scripts[currentTab]) {
          scripts = game.scripts[currentTab];
        }
      } else {
        if (game.scripts && game.scripts[currentFilter]) {
          scripts = game.scripts[currentFilter];
        }
      }

      if (search) {
        scripts = scripts.filter(script => {
          const scriptText = script.name + ' ' + (script.nameAr || '') + ' ' + script.code;
          return scriptText.toLowerCase().includes(search);
        });
      }

      const keyCount = Array.isArray(game.scripts?.key) ? game.scripts.key.length : 0;
      const noKeyCount = Array.isArray(game.scripts?.nokey) ? game.scripts.nokey.length : 0;

      let scriptsHTML = '';

      if (scripts.length) {
        scriptsHTML = `
          <div class="script-section">
            ${scripts.map((script, scriptIndex) => {
              let scriptType = 'key';
              if (game.scripts?.nokey?.includes(script)) {
                scriptType = 'nokey';
              } else if (game.scripts?.key?.includes(script)) {
                scriptType = 'key';
              }
              return `
              <div class="script-item" style="animation-delay: ${scriptIndex * 70}ms;">
                <div class="script-header">
                  <span class="script-name">${script.name}</span>
                  <div style="display:flex;align-items:center;gap:12px;">
                    <div class="script-rating">
                      <div class="stars" dir="ltr">
                        ${[1,2,3,4,5].map(star => `
                          <span class="star ${(script.rating || 0) >= star ? 'active' : ''}" 
                                onclick="setRating(${index}, '${scriptType}', ${scriptIndex}, ${star})">★</span>
                        `).join('')}
                      </div>
                      <span class="rating-text">${script.rating || 0}/5</span>
                    </div>
                    <button class="bookmark-btn ${script.bookmarked ? 'bookmarked' : ''}" 
                            onclick="toggleBookmark(${index}, '${scriptType}', ${scriptIndex})">
                      ${script.bookmarked ? '⭐' : '☆'}
                    </button>
                  </div>
                </div>
                <div class="code">
                  <code>${script.code}</code>
                  <button class="copy" onclick="copyScript(${index}, '${scriptType}', ${scriptIndex})">نسخ</button>
                </div>
                <div class="script-info">
                  <span class="info-tag copy-count">📋 نسخ: <span>${script.copies || 0}</span></span>
                  <span class="info-tag">${scriptType === 'key' ? '🔑 Key' : '🚫 NoKey'}</span>
                </div>
              </div>
            `}).join('')}
          </div>
        `;
      } else {
        scriptsHTML = `<div class="script-section" style="text-align:center;padding:35px;color:#789;" data-ar="لا توجد سكربتات متاحة حالياً." data-en="No scripts available.">لا توجد سكربتات متاحة حالياً.</div>`;
      }

      html += `
        <article class="game" data-game="${index}" style="animation-delay: ${resultCount * 70}ms;">
          <div class="game-head">
            <div class="game-icon">${game.icon || '🎮'}</div>
            <div>
              <h3>${game.name}</h3>
              <p>${game.desc}</p>
            </div>
          </div>
          <div class="game-tabs">
            <button class="tab-btn ${currentTab === 'key' ? 'active' : ''}" onclick="window.activeTab[${index}]='key';render();">
              🔑 <span data-ar="بمفتاح" data-en="Key">بمفتاح</span> <span class="badge">${keyCount}</span>
            </button>
            <button class="tab-btn ${currentTab === 'nokey' ? 'active' : ''}" onclick="window.activeTab[${index}]='nokey';render();">
              🚫 <span data-ar="بدون مفتاح" data-en="NoKey">بدون مفتاح</span> <span class="badge">${noKeyCount}</span>
            </button>
          </div>
          <div class="script">${scriptsHTML}</div>
        </article>
      `;
      resultCount++;
    });

    document.getElementById('cards').innerHTML = html;
    document.getElementById('empty').classList.toggle('hidden', resultCount !== 0);
    updateStats();
    updateTranslations();
  };

  loadBookmarks();
  loadRatings();
  loadCopyCounts();
  updateTranslations();
  render();
  renderBookmarks();

</script>
</body>
</html>
