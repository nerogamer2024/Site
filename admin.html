<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRO HACKER Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#020914;color:#e8f6ff;padding:28px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(35,170,255,.13),transparent 45%)}
.wrap{max-width:1050px;margin:auto}.card{position:relative;background:rgba(5,17,31,.9);border:1px solid rgba(76,190,255,.18);border-radius:22px;padding:25px;box-shadow:0 25px 80px rgba(0,0,0,.4),0 0 45px rgba(25,145,255,.08);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:25px}.logo{width:58px;height:58px;border-radius:50%;overflow:hidden;box-shadow:0 0 25px rgba(25,150,255,.45),0 0 45px rgba(67,217,255,.18)}.logo img{width:100%;height:100%;object-fit:cover}.brand strong{font-size:20px}.brand span{display:block;color:#7190a9;font-size:12px;margin-top:4px}
.login{max-width:420px;margin:55px auto}.login h1{margin:0 0 8px}.muted{color:#7693aa;font-size:13px}.input{width:100%;height:48px;margin-top:9px;border-radius:12px;border:1px solid #193b58;background:#030d18;color:#fff;padding:0 14px;outline:0}.input:focus{border-color:#2caaff;box-shadow:0 0 22px rgba(25,145,255,.12)}button{border:0;border-radius:12px;cursor:pointer;font-weight:800}.primary{width:100%;height:48px;margin-top:13px;color:white;background:linear-gradient(135deg,#0d63d8,#12a9ff);box-shadow:0 10px 30px rgba(20,140,255,.2)}.danger{background:#5a1720;color:#ffd9dd;padding:9px 13px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.hidden{display:none!important}.msg{min-height:20px;margin-top:10px;color:#ff8f9a;font-size:12px}.table-wrap{overflow:auto;border:1px solid rgba(83,170,230,.12);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:14px;border-bottom:1px solid rgba(83,170,230,.09);font-size:13px}th{color:#78bde2;background:rgba(35,150,220,.06)}td{color:#c8dcea}.pill{padding:5px 9px;border-radius:20px;background:rgba(67,217,255,.08);color:#75d8ff;font-size:11px}.reset{background:#0d4266;color:#dff6ff;padding:8px 10px}.empty{text-align:center;padding:30px;color:#7895aa}.modal{position:fixed;inset:0;background:rgba(0,5,12,.75);display:grid;place-items:center;padding:20px;z-index:5}.modalbox{width:min(420px,100%);background:#071522;border:1px solid rgba(76,190,255,.22);border-radius:18px;padding:22px;box-shadow:0 25px 80px #000}.modalbox h2{margin-top:0}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.secondary{background:#132638;color:#b9d5e8;padding:10px 14px}.modalbox .primary{width:auto;padding:0 18px;margin:0}.notice{font-size:11px;color:#68869d;margin-top:10px;line-height:1.6}
</style>
</head>
<body><div class="wrap"><div class="card">
<div class="brand"><div class="logo"><img src="images/logo.png" alt="PRO HACKER"></div><div><strong>PRO HACKER Admin</strong><span>Account management dashboard</span></div></div>
<section id="loginView" class="login"><h1>Admin login</h1><p class="muted">Use the admin credentials configured on the server.</p><input id="adminUser" class="input" placeholder="Admin username" autocomplete="username"><input id="adminPass" class="input" type="password" placeholder="Admin password" autocomplete="current-password"><button id="loginBtn" class="primary">Sign in</button><div id="loginMsg" class="msg"></div></section>
<section id="dashView" class="hidden"><div class="top"><div><h1 style="margin:0">Users</h1><div class="muted">View accounts and reset passwords without exposing stored passwords.</div></div><button id="logoutBtn" class="danger">Logout</button></div><div class="table-wrap"><table><thead><tr><th>Username</th><th>Created</th><th>Bookmarks</th><th>Ratings</th><th>Action</th></tr></thead><tbody id="usersBody"></tbody></table></div><div id="dashMsg" class="msg"></div></section>
</div></div>
<div id="resetModal" class="modal hidden"><div class="modalbox"><h2>Reset password</h2><div id="resetFor" class="muted"></div><input id="newPass" class="input" type="password" placeholder="New password (6-128 characters)" autocomplete="new-password"><div class="actions"><button id="cancelReset" class="secondary">Cancel</button><button id="confirmReset" class="primary">Reset password</button></div><div id="resetMsg" class="msg"></div></div></div>
<script>
let selectedUser=null;
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{};if(!r.ok)throw new Error(d.error||d.message||'Request failed');return d}
async function check(){try{const d=await api('/api/admin/me');if(d.authenticated){$('loginView').classList.add('hidden');$('dashView').classList.remove('hidden');loadUsers()}}catch(e){}}
$('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('adminUser').value,password:$('adminPass').value})});$('loginView').classList.add('hidden');$('dashView').classList.remove('hidden');loadUsers()}catch(e){$('loginMsg').textContent=e.message}};
$('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
async function loadUsers(){try{const d=await api('/api/admin/users');$('usersBody').innerHTML=d.users.length?d.users.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${new Date(u.createdAt).toLocaleString()}</td><td>${u.bookmarks}</td><td>${u.ratings}</td><td><button class="reset" onclick="openReset('${escAttr(u.username)}')">Reset password</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No registered users</td></tr>'}catch(e){$('dashMsg').textContent=e.message}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return esc(s)}
window.openReset=u=>{selectedUser=u;$('resetFor').textContent='Account: '+u;$('newPass').value='';$('resetMsg').textContent='';$('resetModal').classList.remove('hidden');$('newPass').focus()};
$('cancelReset').onclick=()=>$('resetModal').classList.add('hidden');
$('confirmReset').onclick=async()=>{try{await api('/api/admin/reset-password',{method:'POST',body:JSON.stringify({username:selectedUser,newPassword:$('newPass').value})});$('resetMsg').style.color='#79e1a6';$('resetMsg').textContent='Password reset successfully.';setTimeout(()=>$('resetModal').classList.add('hidden'),900)}catch(e){$('resetMsg').style.color='#ff8f9a';$('resetMsg').textContent=e.message}};
$('logoutBtn').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};check();
</script></body></html>
